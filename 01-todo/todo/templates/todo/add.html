{% extends "base.html" %}

{% block title %}Add Task | Todo App{% endblock %}

{% block content %}
  <h2>Add Task</h2>
  <form method="post">
    {% csrf_token %}
    {% include "todo/_form.html" with title=None description=None %}
    <div style="margin-top:.5rem">
      <button type="submit">Create</button>
      <a href="{% url 'todo:index' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
